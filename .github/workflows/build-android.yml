name: Build & Release Android APK

# 手动触发：GitHub 仓库 → Actions → Build & Release Android APK → Run workflow
# push 到 main 且改动 android/ 或本文件时自动构建并发布为 pre-release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release 版本号（例：1.0.1，留空则用 versionName + 日期 + run_number）'
        required: false
        default: ''
      prerelease:
        description: '是否标记为 pre-release'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      draft:
        description: '是否创建为 draft（草稿，不公开）'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write  # 创建 Release / 上传 APK 需要

jobs:
  # ─────────── 1. 生成本次发布用的 tag & Release ───────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      release_id: ${{ steps.create.outputs.result }}
      draft: ${{ steps.flags.outputs.draft }}
      prerelease: ${{ steps.flags.outputs.prerelease }}
      version_code: ${{ steps.resolve.outputs.version_code }}
      version_name: ${{ steps.resolve.outputs.version_name }}
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本号
        id: resolve
        shell: bash
        run: |
          INPUT="${{ github.event.inputs.version }}"
          CODE="${{ github.run_number }}"
          if [ -z "$INPUT" ]; then
            # 未输入：取 build.gradle.kts 里 versionName 的 major.minor 作基线，patch 用 run_number 自动递增
            BASE=$(grep -m1 'versionName' android/app/build.gradle.kts \
              | sed -E 's/.*"([^"]+)".*/\1/' | sed -E 's/\.[0-9]+$//')
            VERSION_NAME="${BASE}.${CODE}"
            TAG="v${VERSION_NAME}"
          else
            # 用户输入的版本号，自动补 v 前缀
            case "$INPUT" in
              v*) VERSION_NAME="${INPUT#v}"; TAG="$INPUT" ;;
              *)  VERSION_NAME="$INPUT"; TAG="v$INPUT" ;;
            esac
          fi
          # 若同名 tag 已存在（手动重跑），再追加 run_id 后缀避免冲突
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG="${TAG}-r${{ github.run_id }}"
          fi
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "版本: code=$CODE name=$VERSION_NAME tag=$TAG"

      - name: 解析发布标志
        id: flags
        shell: bash
        run: |
          # push 自动触发：直接公开发布为 pre-release（debug 自动构建）
          # workflow_dispatch 手动触发：用界面选择的 draft/prerelease（默认 draft）
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DRAFT="${{ github.event.inputs.draft }}"
            PRE="${{ github.event.inputs.prerelease }}"
            [ -z "$DRAFT" ] && DRAFT="true"
            [ -z "$PRE" ] && PRE="false"
          else
            DRAFT="false"
            PRE="true"
          fi
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "发布标志: draft=$DRAFT prerelease=$PRE"

      - name: 创建 Release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.resolve.outputs.tag }}';
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              tag_name: tag,
              name: `📝 待办小组件 ${tag}`,
              body: `## 待办小组件 ${tag}\n\nCloudflare Workers 个人仪表盘的 Android 客户端：桌面待办小组件 + 内嵌网页的 5 Tab 应用壳。\n\n### 下载\n- 下方 \`.apk\` 文件（已配置 release 签名 Secret 则为 release 签名，否则为 debug 签名）\n\n> 安装后先打开 App 登录，再在桌面添加「待办速览」小组件即可自动显示今日+逾期待办，无需额外配置。`,
              draft: ${{ steps.flags.outputs.draft }},
              prerelease: ${{ steps.flags.outputs.prerelease }},
            });
            return data.id;

  # ─────────── 2. 构建 APK & 上传到 Release ───────────
  build:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform & build-tools
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Decode release keystore (if configured)
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            echo "apk=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "未配置 RELEASE_KEYSTORE_BASE64，使用 debug 签名构建"
          else
            mkdir -p keystore
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > keystore/release.keystore
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "apk=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "已解码 release keystore，使用 release 签名构建"
          fi

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
          VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
          RELEASE_KEYSTORE_PATH: ${{ steps.keystore.outputs.mode == 'release' && format('{0}/keystore/release.keystore', github.workspace) || '' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ "${{ steps.keystore.outputs.mode }}" = "release" ]; then
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
          else
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Rename APK with tag
        id: rename
        run: |
          SRC="${{ steps.keystore.outputs.apk }}"
          OUT="todo-widget-${{ needs.prepare.outputs.tag }}.apk"
          cp "$SRC" "$OUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: todo-widget-${{ needs.prepare.outputs.tag }}
          path: ${{ steps.rename.outputs.out }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK to Release
        uses: actions/github-script@v7
        env:
          APK_PATH: ${{ github.workspace }}/${{ steps.rename.outputs.out }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          ASSET_NAME: todo-widget-${{ needs.prepare.outputs.tag }}.apk
        with:
          script: |
            const fs = require('fs');
            const apk = fs.readFileSync(process.env.APK_PATH);
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              name: process.env.ASSET_NAME,
              data: apk,
            });

  # ─────────── 3. 构建完成后发布 Release（仅手动触发且 draft=false 时）───────────
  # push 自动触发在 create 时已直接发布为 pre-release，无需此步
  publish:
    needs: [prepare, build]
    if: ${{ github.event_name == 'workflow_dispatch' && needs.prepare.outputs.draft == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: 把 draft 翻成正式发布
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              release_id: ${{ needs.prepare.outputs.release_id }},
              draft: false,
              prerelease: ${{ needs.prepare.outputs.prerelease }},
            });
